<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard Example</title>
  <style>
    body { background: #1B1D29; color: #fff; font-family: 'Oxanium', sans-serif; }
    .leaderboard { max-width: 600px; margin: 40px auto; background: #23263a; border-radius: 16px; box-shadow: 0 0 40px rgba(89,86,255,0.3); padding: 24px; }
    .row { display: grid; grid-template-columns: 60px 1fr 120px 120px; align-items: center; padding: 12px 0; border-bottom: 1px solid #2c2f4a; }
    .row.header { color: #5CFFC1; font-weight: bold; border-bottom: 2px solid #5956FF; }
    .row:last-child { border-bottom: none; }
    .username { font-weight: 600; }
    .rank { font-size: 1.2em; }
    .prize { color: #5CFFC1; font-weight: bold; text-align: right; }
    .wagered { text-align: right; }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="leaderboard">
    <div class="row header">
      <div>Rank</div>
      <div>Username</div>
      <div>Wagered</div>
      <div>Prize</div>
    </div>
    <div id="leaderboard-rows"></div>
  </div>
  <script>
    // Example leaderboard data
    const leaderboardData = [
      { name: 'AliceWonder', wagered: 1200, prize: 500 },
      { name: 'Bob', wagered: 1100, prize: 300 },
      { name: 'Charlie123', wagered: 900, prize: 200 },
      { name: 'Daisy', wagered: 800, prize: 100 },
      { name: 'Eve', wagered: 700, prize: 50 },
    ];

    function maskUsername(name) {
      if (name.length <= 2) return name;
      if (name.length < 5) {
        // Show first and last character
        return name.charAt(0) + '*'.repeat(name.length - 2) + name.charAt(name.length - 1);
      } else {
        // Show first 2 and last 2 characters
        return name.substring(0, 2) + '*'.repeat(name.length - 4) + name.substring(name.length - 2);
      }
    }

    function formatCurrency(amount) {
      return '$' + amount.toLocaleString();
    }

    const rows = leaderboardData.map((player, i) => `
      <div class="row">
        <div class="rank">#${i + 1}</div>
        <div class="username">${maskUsername(player.name)}</div>
        <div class="wagered">${formatCurrency(player.wagered)}</div>
        <div class="prize">${formatCurrency(player.prize)}</div>
      </div>
    `).join('');
    document.getElementById('leaderboard-rows').innerHTML = rows;
  </script>
</body>
</html>
