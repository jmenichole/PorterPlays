<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Porter Plays | Thrill & Goated Leaderboards</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		* { margin: 0; padding: 0; box-sizing: border-box; }
		body { 
			background: #1B1D29; 
			color: #fff; 
			font-family: 'Oxanium', sans-serif;
			background-image: radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
			background-size: 25px 25px;
		}
		/* Note: For the static copy, styles should be maintained in the source file; this copy simply mirrors the content. */
	</style>
</head>
<body>
	<!-- This static public copy mirrors the main porter-plays-landing.html so it is available at /porter-plays-landing.html in dev and GH Pages. -->
    
	<!-- BEGIN MIRROR CONTENT -->
    
	<!-- Header and content mirrored via server-side include is not available; simplest is to reference the root page -->
	<script>
		// If loaded from the repository root (GH Pages), try to navigate to the canonical page at repo base
		(function(){
			var path = window.location.pathname;
			// On GH Pages (base /PorterPlays/), this file is already at the right path.
			// If opened under a different path, redirect to canonical path.
			if (!/\/PorterPlays\/.+/.test(path)) {
				// Best-effort redirect; harmless if already correct
				var base = '/PorterPlays/porter-plays-landing.html';
				if (path !== base) {
					window.location.replace(base);
				}
			}
		})();
	</script>
	<iframe src="/PorterPlays/porter-plays-landing.html" style="border:0; width:100%; height:100vh"></iframe>
    
	<!-- END MIRROR CONTENT -->
</body>
</html>
