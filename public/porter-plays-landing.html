<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Porter Plays | Thrill & Goated Leaderboards</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;600;700;800&display=swap" rel="stylesheet">
	<style>
		/* Mirror note: This file fetches and renders the root porter-plays-landing.html to avoid duplication */
		html, body { height: 100%; }
		body { margin: 0; background: #1B1D29; color: #fff; font-family: 'Oxanium', sans-serif; }
	</style>
</head>
<body>
	<!-- This static public copy mirrors the main porter-plays-landing.html so it is available at /porter-plays-landing.html in dev and GH Pages. -->
    
	<!-- BEGIN MIRROR CONTENT -->
    
		<script>
		(async function() {
			var base = '/PorterPlays/porter-plays-landing.html';
			try {
				var res = await fetch(base, { cache: 'no-cache' });
				if (!res.ok) throw new Error('Failed to fetch landing source');
				var html = await res.text();
				document.open();
				document.write(html);
				document.close();
			} catch (err) {
				document.body.innerHTML = '<div style="padding:2rem; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;">Failed to load landing page. <a href="'+base+'" style="color:#5CFFC1;">Open directly</a>.</div>';
				console.error(err);
			}
		})();
		</script>
    
	<!-- END MIRROR CONTENT -->
</body>
</html>
